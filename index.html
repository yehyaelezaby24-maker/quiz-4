button{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 14px}
button:hover{border-color:var(--ac)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.on{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:600}

.opt.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.opt:disabled{cursor:default}
.note{margin:8px 0 0;font-size:15px;color:var(--no)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
